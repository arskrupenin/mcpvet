[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "mcpvet"
version = "0.1.0"
description = "Security analysis tool for MCP servers"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0.0",
    "pydantic>=2.0.0",
    "rich>=13.0.0",
    "httpx>=0.27.0",
]

[project.scripts]
mcpvet = "analyzer.cli:main"

[tool.setuptools.packages.find]
include = ["analyzer*"]
