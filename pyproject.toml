[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "mcpvet"
version = "0.2.0"
description = "Security analysis tool for MCP servers"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0.0",
    "pydantic>=2.0.0",
    "rich>=13.0.0",
    "httpx>=0.27.0",
]
keywords = ["mcp", "security", "vulnerability", "analysis", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Topic :: Security",
]

[project.scripts]
mcpvet = "analyzer.cli:main"

[project.urls]
Homepage = "https://github.com/arskrupen/mcpvet"

[tool.setuptools.packages.find]
include = ["analyzer*"]
